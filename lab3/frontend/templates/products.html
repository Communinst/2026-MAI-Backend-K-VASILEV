<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Lab3</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/web/products" class="nav-link">Продукты</a>
            <a href="/web/profile" class="nav-link">Профиль</a>
        </nav>
    </header>

    <main class="main">
        <div class="products-container">
            <h1>{{ .Title }}</h1>

            <div class="products-grid">
                {{ range .Products }}
                <div class="product-card">
                    <h3 class="product-name">{{ .Name }}</h3>
                    <p class="product-category">{{ .Category }}</p>
                    <p class="product-price">${{ .Price }}</p>
                    <a href="/web/products/{{ .ID }}" class="btn btn-primary">Подробнее</a>
                </div>
                {{ end }}
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Lab3. All rights reserved.</p>
    </footer>

    <!-- Centrifugo library -->
    <script src="https://unpkg.com/centrifuge@5.0.1/dist/centrifuge.js"></script>
    <script>
        const centrifuge = new Centrifuge("ws://localhost:8001/connection/websocket");
        
        centrifuge.on('connected', function (ctx) {
            console.log("Connected to Centrifugo!");
        });

        const sub = centrifuge.newSubscription("products");
        sub.on('publication', function (ctx) {
            console.log("New product event:", ctx.data);
            if (ctx.data.action === "create" && ctx.data.product) {
                const product = ctx.data.product;
                const grid = document.querySelector('.products-grid');
                if (grid) {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-category">Категория: ${product.category_id}</p>
                        <p class="product-price">$${product.price}</p>
                        <a href="/web/products/${product.id}" class="btn btn-primary">Подробнее</a>
                    `;
                    grid.insertBefore(card, grid.firstChild);
                }
            }
        });

        sub.subscribe();
        centrifuge.connect();

        function viewProduct(id) {
            alert('Просмотр продукта ID: ' + id);
        }
    </script>
</body>
</html>
